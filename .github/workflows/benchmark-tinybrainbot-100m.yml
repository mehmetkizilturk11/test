name: benchmark-tinybrainbot-100m

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/benchmark-tinybrainbot-100m.yml'

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build git python3 python3-pip
          python3 -m pip install --break-system-packages --upgrade 'huggingface_hub[hf_xet]'
          mkdir -p out/models out/info

      - name: Clone pinned llama.cpp
        run: |
          git init llama.cpp
          git -C llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C llama.cpp fetch --depth 1 origin b81c99b479d4c24e5eeca10de99032ebd343ef8f
          git -C llama.cpp checkout --detach FETCH_HEAD

      - name: Install sampled test runner
        run: |
          cat > llama.cpp/examples/simple/simple.cpp <<'CPP'
          #include "llama.h"
          #include <algorithm>
          #include <cstdio>
          #include <cstdlib>
          #include <cstring>
          #include <string>
          #include <vector>

          int main(int argc, char ** argv) {
              std::string model, prompt;
              int n_predict=48, n_ctx=128, threads=2, top_k=40;
              float temp=0.65f, top_p=0.90f, repeat=1.12f;
              uint32_t seed=1;
              for (int i=1;i<argc;i++) {
                  if (!strcmp(argv[i],"-m") && i+1<argc) model=argv[++i];
                  else if (!strcmp(argv[i],"-p") && i+1<argc) prompt=argv[++i];
                  else if (!strcmp(argv[i],"-n") && i+1<argc) n_predict=atoi(argv[++i]);
                  else if (!strcmp(argv[i],"-c") && i+1<argc) n_ctx=atoi(argv[++i]);
                  else if (!strcmp(argv[i],"-t") && i+1<argc) threads=atoi(argv[++i]);
                  else if (!strcmp(argv[i],"--temp") && i+1<argc) temp=atof(argv[++i]);
                  else if (!strcmp(argv[i],"--top-k") && i+1<argc) top_k=atoi(argv[++i]);
                  else if (!strcmp(argv[i],"--top-p") && i+1<argc) top_p=atof(argv[++i]);
                  else if (!strcmp(argv[i],"--repeat") && i+1<argc) repeat=atof(argv[++i]);
                  else if (!strcmp(argv[i],"--seed") && i+1<argc) seed=(uint32_t)strtoul(argv[++i],nullptr,10);
              }
              if (model.empty() || prompt.empty()) return 2;
              llama_model_params mp=llama_model_default_params(); mp.n_gpu_layers=0;
              llama_model * m=llama_model_load_from_file(model.c_str(),mp); if(!m) return 3;
              const llama_vocab * v=llama_model_get_vocab(m);
              int np=-llama_tokenize(v,prompt.c_str(),prompt.size(),nullptr,0,true,true);
              if (np <= 0 || np >= n_ctx) return 4;
              std::vector<llama_token> toks(np);
              if (llama_tokenize(v,prompt.c_str(),prompt.size(),toks.data(),toks.size(),true,true)<0) return 5;
              llama_context_params cp=llama_context_default_params(); cp.n_ctx=n_ctx; cp.n_batch=std::min(np,n_ctx); cp.no_perf=false;
              llama_context * ctx=llama_init_from_model(m,cp); if(!ctx) return 6;
              llama_set_n_threads(ctx,threads,threads);
              auto sp=llama_sampler_chain_default_params(); sp.no_perf=false;
              llama_sampler * sm=llama_sampler_chain_init(sp);
              llama_sampler_chain_add(sm,llama_sampler_init_penalties(llama_vocab_n_tokens(v),64,repeat,0.0f,0.0f));
              llama_sampler_chain_add(sm,llama_sampler_init_top_k(top_k));
              llama_sampler_chain_add(sm,llama_sampler_init_top_p(top_p,1));
              llama_sampler_chain_add(sm,llama_sampler_init_temp(temp));
              llama_sampler_chain_add(sm,llama_sampler_init_dist(seed));
              llama_batch batch=llama_batch_get_one(toks.data(),toks.size());
              int generated=0; int64_t t0=ggml_time_us();
              while(generated<n_predict) {
                  if(llama_decode(ctx,batch)!=0) break;
                  llama_token id=llama_sampler_sample(sm,ctx,-1);
                  llama_sampler_accept(sm,id);
                  if(llama_vocab_is_eog(v,id)) break;
                  char piece[512]; int len=llama_token_to_piece(v,id,piece,sizeof(piece),0,true);
                  if(len<0) break;
                  fwrite(piece,1,len,stdout); fflush(stdout);
                  batch=llama_batch_get_one(&id,1); generated++;
              }
              printf("\n");
              double sec=(ggml_time_us()-t0)/1000000.0;
              fprintf(stderr,"[BENCH] generated=%d time=%.3fs speed=%.2f tok/s\n",generated,sec,sec>0?generated/sec:0.0);
              llama_sampler_free(sm); llama_free(ctx); llama_model_free(m);
              return 0;
          }
          CPP
          cat > llama.cpp/examples/simple/CMakeLists.txt <<'CMAKE'
          set(TARGET llama-simple)
          add_executable(${TARGET} simple.cpp)
          install(TARGETS ${TARGET} RUNTIME)
          target_link_libraries(${TARGET} PRIVATE llama ${CMAKE_THREAD_LIBS_INIT})
          target_compile_features(${TARGET} PRIVATE cxx_std_17)
          CMAKE

      - name: Download official TinyBrainBot F16 GGUF
        run: |
          set -o pipefail
          hf download nkthebass/tinybrainbot-100m-v3-instruct --include '*f16.gguf' --local-dir tinybrain-hf
          SRC=$(find tinybrain-hf -type f -iname '*f16.gguf' | head -n1)
          test -n "$SRC"
          cp "$SRC" out/models/TinyBrainBot-100M-v3-Instruct.F16.gguf
          ls -lh out/models/TinyBrainBot-100M-v3-Instruct.F16.gguf | tee out/info/f16-size.txt

      - name: Build host quantizer and runner
        run: |
          cmake -S llama.cpp -B llama.cpp/build-host -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DGGML_CCACHE=OFF \
            -DLLAMA_CURL=OFF -DLLAMA_OPENSSL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_EXAMPLES=ON
          cmake --build llama.cpp/build-host --target llama-quantize llama-simple -j2

      - name: Quantize Q2_K and Q3_K_M
        run: |
          set -o pipefail
          Q=llama.cpp/build-host/bin/llama-quantize
          SRC=out/models/TinyBrainBot-100M-v3-Instruct.F16.gguf
          "$Q" "$SRC" out/models/TinyBrainBot-100M-v3-Instruct.Q2_K.gguf Q2_K 2>&1 | tee out/info/quant-q2k.txt
          "$Q" "$SRC" out/models/TinyBrainBot-100M-v3-Instruct.Q3_K_M.gguf Q3_K_M 2>&1 | tee out/info/quant-q3km.txt
          rm "$SRC"
          ls -lh out/models/*.gguf | tee out/info/model-sizes.txt

      - name: Benchmark quantized models
        run: |
          set -o pipefail
          R=llama.cpp/build-host/bin/llama-simple
          for M in out/models/*.gguf; do
            N=$(basename "$M")
            LOG="out/info/${N}.txt"
            echo "=== $N ===" | tee "$LOG"
            for Q in 'What is the capital of France? Answer briefly.' 'What is 2+2? Answer briefly.' 'Explain gravity in one short sentence.'; do
              P=$(printf '%s\n%s\n%s\n%s\n' '<|user|>' "$Q" '<|end|>' '<|assistant|>')
              echo "Q: $Q" | tee -a "$LOG"
              "$R" -m "$M" -c 128 -n 48 -t 2 --temp 0.65 --top-k 40 --top-p 0.90 --repeat 1.12 --seed 1 -p "$P" 2>&1 | tee -a "$LOG"
            done
          done

      - name: Checksums
        run: |
          sha256sum out/models/*.gguf | tee out/info/SHA256SUMS.txt

      - name: Upload 100M candidates
        uses: actions/upload-artifact@v4
        with:
          name: MiyooAI-TinyBrainBot100M-candidates
          path: out/
          compression-level: 6
