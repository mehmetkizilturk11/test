name: build-miyooai-release

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-miyooai-release.yml'

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build wget file git git-lfs xz-utils python3 python3-pip
          git lfs install
          python3 -m pip install --break-system-packages --upgrade \
            numpy sentencepiece transformers safetensors protobuf 'huggingface_hub[hf_xet]'
          python3 -m pip install --break-system-packages --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install Miyoo Mini Buildroot toolchain
        run: |
          wget -q -O /tmp/miyoomini-toolchain.tar.xz \
            https://github.com/shauninman/miyoomini-toolchain-buildroot/releases/download/v0.0.3/miyoomini-toolchain.tar.xz
          sudo tar -C /opt -xf /tmp/miyoomini-toolchain.tar.xz
          /opt/miyoomini-toolchain/usr/bin/arm-linux-gnueabihf-gcc --version

      - name: Clone pinned llama.cpp
        run: |
          git init llama.cpp
          git -C llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C llama.cpp fetch --depth 1 origin b81c99b479d4c24e5eeca10de99032ebd343ef8f
          git -C llama.cpp checkout --detach FETCH_HEAD
          echo "b81c99b479d4c24e5eeca10de99032ebd343ef8f" > llama-commit.txt

      - name: Install Miyoo inference runtime source
        run: |
          cat > llama.cpp/examples/simple/simple.cpp <<'CPP'
          #include "llama.h"
          #include <algorithm>
          #include <clocale>
          #include <cstdio>
          #include <cstdlib>
          #include <cstring>
          #include <string>
          #include <vector>

          static void usage(const char * exe) {
              std::fprintf(stderr,
                  "Usage: %s -m model.gguf [-c ctx] [-n predict] [-t threads] -p prompt\n"
                  "Defaults: -c 128 -n 32 -t 2\n", exe);
          }

          static void print_mem(const char * stage) {
              FILE * f = std::fopen("/proc/self/status", "r");
              if (!f) return;
              char line[256];
              std::fprintf(stderr, "[MEM] %s ", stage);
              while (std::fgets(line, sizeof(line), f)) {
                  if (std::strncmp(line, "VmRSS:", 6) == 0 ||
                      std::strncmp(line, "VmHWM:", 6) == 0 ||
                      std::strncmp(line, "VmSize:", 7) == 0) {
                      char key[32] = {0};
                      long kb = 0;
                      if (std::sscanf(line, "%31s %ld", key, &kb) == 2) {
                          std::fprintf(stderr, "%s=%ldKB ", key, kb);
                      }
                  }
              }
              std::fprintf(stderr, "\n");
              std::fclose(f);
          }

          int main(int argc, char ** argv) {
              std::setlocale(LC_NUMERIC, "C");
              std::string model_path;
              std::string prompt;
              int n_ctx = 128;
              int n_predict = 32;
              int n_threads = 2;

              for (int i = 1; i < argc; ++i) {
                  if (std::strcmp(argv[i], "-m") == 0 && i + 1 < argc) {
                      model_path = argv[++i];
                  } else if (std::strcmp(argv[i], "-c") == 0 && i + 1 < argc) {
                      n_ctx = std::max(32, std::atoi(argv[++i]));
                  } else if (std::strcmp(argv[i], "-n") == 0 && i + 1 < argc) {
                      n_predict = std::max(1, std::atoi(argv[++i]));
                  } else if (std::strcmp(argv[i], "-t") == 0 && i + 1 < argc) {
                      n_threads = std::max(1, std::atoi(argv[++i]));
                  } else if (std::strcmp(argv[i], "-p") == 0 && i + 1 < argc) {
                      prompt = argv[++i];
                  } else {
                      if (!prompt.empty()) prompt += " ";
                      prompt += argv[i];
                  }
              }

              if (model_path.empty() || prompt.empty()) {
                  usage(argv[0]);
                  return 2;
              }

              std::fprintf(stderr, "[MIYOOAI] ctx=%d predict=%d threads=%d\n", n_ctx, n_predict, n_threads);
              print_mem("startup");

              llama_model_params model_params = llama_model_default_params();
              model_params.n_gpu_layers = 0;
              model_params.use_mmap = true;
              model_params.use_mlock = false;

              const int64_t t_load0 = ggml_time_us();
              llama_model * model = llama_model_load_from_file(model_path.c_str(), model_params);
              const int64_t t_load1 = ggml_time_us();
              if (!model) {
                  std::fprintf(stderr, "[ERROR] unable to load model: %s\n", model_path.c_str());
                  return 3;
              }
              std::fprintf(stderr, "[MIYOOAI] model_load=%.3fs\n", (t_load1 - t_load0) / 1000000.0);
              print_mem("after_model");

              const llama_vocab * vocab = llama_model_get_vocab(model);
              const int n_prompt = -llama_tokenize(vocab, prompt.c_str(), prompt.size(), nullptr, 0, true, true);
              if (n_prompt <= 0) {
                  std::fprintf(stderr, "[ERROR] tokenizer size query failed\n");
                  llama_model_free(model);
                  return 4;
              }

              std::vector<llama_token> prompt_tokens(n_prompt);
              if (llama_tokenize(vocab, prompt.c_str(), prompt.size(), prompt_tokens.data(), prompt_tokens.size(), true, true) < 0) {
                  std::fprintf(stderr, "[ERROR] tokenization failed\n");
                  llama_model_free(model);
                  return 4;
              }

              if (n_prompt >= n_ctx) {
                  std::fprintf(stderr, "[ERROR] prompt tokens=%d exceed context=%d\n", n_prompt, n_ctx);
                  llama_model_free(model);
                  return 5;
              }
              n_predict = std::min(n_predict, n_ctx - n_prompt);
              std::fprintf(stderr, "[MIYOOAI] prompt_tokens=%d effective_predict=%d\n", n_prompt, n_predict);

              llama_context_params ctx_params = llama_context_default_params();
              ctx_params.n_ctx = (uint32_t) n_ctx;
              ctx_params.n_batch = (uint32_t) std::min(n_prompt, n_ctx);
              ctx_params.no_perf = false;

              llama_context * ctx = llama_init_from_model(model, ctx_params);
              if (!ctx) {
                  std::fprintf(stderr, "[ERROR] context creation failed\n");
                  llama_model_free(model);
                  return 6;
              }
              llama_set_n_threads(ctx, n_threads, n_threads);
              print_mem("after_context");

              auto sparams = llama_sampler_chain_default_params();
              sparams.no_perf = false;
              llama_sampler * sampler = llama_sampler_chain_init(sparams);
              llama_sampler_chain_add(sampler, llama_sampler_init_greedy());

              llama_batch batch = llama_batch_get_one(prompt_tokens.data(), prompt_tokens.size());
              int generated = 0;
              const int64_t t_gen0 = ggml_time_us();

              while (generated < n_predict) {
                  if (llama_decode(ctx, batch) != 0) {
                      std::fprintf(stderr, "\n[ERROR] llama_decode failed\n");
                      break;
                  }

                  llama_token id = llama_sampler_sample(sampler, ctx, -1);
                  if (llama_vocab_is_eog(vocab, id)) break;

                  char piece[512];
                  int len = llama_token_to_piece(vocab, id, piece, sizeof(piece), 0, true);
                  if (len < 0) {
                      std::fprintf(stderr, "\n[ERROR] token_to_piece failed\n");
                      break;
                  }
                  std::fwrite(piece, 1, (size_t) len, stdout);
                  std::fflush(stdout);
                  batch = llama_batch_get_one(&id, 1);
                  ++generated;
              }

              std::printf("\n");
              const int64_t t_gen1 = ggml_time_us();
              const double seconds = (t_gen1 - t_gen0) / 1000000.0;
              std::fprintf(stderr, "[MIYOOAI] generated=%d generation_time=%.3fs speed=%.3f tok/s\n",
                           generated, seconds, seconds > 0 ? generated / seconds : 0.0);
              print_mem("after_generate");
              llama_perf_context_print(ctx);

              llama_sampler_free(sampler);
              llama_free(ctx);
              llama_model_free(model);
              print_mem("shutdown");
              return 0;
          }
          CPP

          cat > llama.cpp/examples/simple/CMakeLists.txt <<'CMAKE'
          set(TARGET llama-simple)
          add_executable(${TARGET} simple.cpp)
          install(TARGETS ${TARGET} RUNTIME)
          target_link_libraries(${TARGET} PRIVATE llama ${CMAKE_THREAD_LIBS_INIT})
          target_compile_features(${TARGET} PRIVATE cxx_std_17)
          CMAKE

      - name: Cross compile native Miyoo runtime
        run: |
          cat > miyoo-toolchain.cmake <<'EOF'
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR arm)
          set(CMAKE_TRY_COMPILE_TARGET_TYPE STATIC_LIBRARY)
          set(MIYOO_TC /opt/miyoomini-toolchain/usr/bin/arm-linux-gnueabihf-)
          set(CMAKE_C_COMPILER ${MIYOO_TC}gcc)
          set(CMAKE_CXX_COMPILER ${MIYOO_TC}g++)
          set(CMAKE_C_FLAGS_INIT "-march=armv7-a -mfpu=neon-vfpv4 -mfloat-abi=hard -ffunction-sections -fdata-sections")
          set(CMAKE_CXX_FLAGS_INIT "-march=armv7-a -mfpu=neon-vfpv4 -mfloat-abi=hard -ffunction-sections -fdata-sections")
          set(CMAKE_EXE_LINKER_FLAGS_INIT "-static-libgcc -static-libstdc++ -Wl,--gc-sections")
          set(CMAKE_CXX_STANDARD_LIBRARIES "-lstdc++fs -lpthread")
          set(GGML_NATIVE OFF CACHE BOOL "" FORCE)
          set(GGML_CPU_ALL_VARIANTS OFF CACHE BOOL "" FORCE)
          set(GGML_CPU_ARM_ARCH "armv7-a" CACHE STRING "" FORCE)
          EOF

          cmake -S llama.cpp -B llama.cpp/build-miyoo -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/miyoo-toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ALL_VARIANTS=OFF \
            -DGGML_CPU_ARM_ARCH=armv7-a \
            -DGGML_OPENMP=OFF \
            -DGGML_BLAS=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DGGML_CCACHE=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON
          cmake --build llama.cpp/build-miyoo --target llama-simple -j2

          mkdir -p out/bin out/models out/info
          cp llama.cpp/build-miyoo/bin/llama-simple out/bin/miyoo-infer
          /opt/miyoomini-toolchain/usr/bin/arm-linux-gnueabihf-strip out/bin/miyoo-infer || true
          file out/bin/miyoo-infer | tee out/info/runtime-file.txt
          /opt/miyoomini-toolchain/usr/bin/arm-linux-gnueabihf-readelf -A out/bin/miyoo-infer | tee out/info/runtime-attributes.txt
          /opt/miyoomini-toolchain/usr/bin/arm-linux-gnueabihf-readelf -d out/bin/miyoo-infer | tee out/info/runtime-dynamic.txt
          ls -lh out/bin/miyoo-infer | tee out/info/runtime-size.txt

      - name: Download Stentor 30M Q4_K_M
        run: |
          hf download mradermacher/Stentor-30M-Instruct-GGUF \
            --include '*Q4_K_M.gguf' --local-dir stentor-hf
          STENTOR=$(find stentor-hf -type f -name '*Q4_K_M.gguf' | head -n 1)
          test -n "$STENTOR"
          cp "$STENTOR" out/models/Stentor-30M-Instruct.Q4_K_M.gguf
          test -s out/models/Stentor-30M-Instruct.Q4_K_M.gguf
          ls -lh out/models/Stentor-30M-Instruct.Q4_K_M.gguf

      - name: Download Syko Turkish 51M
        run: |
          hf download SykoSLM/SykoLLM-V1.2-Turkish-Instruct --local-dir syko-hf
          test -s syko-hf/config.json
          test -s syko-hf/model.safetensors
          python3 - <<'PY'
          import json
          p='syko-hf/config.json'
          d=json.load(open(p))
          print('Syko architectures:', d.get('architectures'))
          print('Syko n_layer:', d.get('n_layer'))
          print('Syko n_embd:', d.get('n_embd'))
          print('Syko n_ctx:', d.get('n_ctx'))
          PY
          ls -lh syko-hf | tee out/info/syko-hf-files.txt

      - name: Convert Syko GPT-2 to GGUF F16
        run: |
          python3 llama.cpp/convert_hf_to_gguf.py syko-hf \
            --outfile out/models/SykoLLM-V1.2-Turkish-Instruct.F16.gguf \
            --outtype f16
          test -s out/models/SykoLLM-V1.2-Turkish-Instruct.F16.gguf
          ls -lh out/models/SykoLLM-V1.2-Turkish-Instruct.F16.gguf

      - name: Build host quantizer and host inference test
        run: |
          cmake -S llama.cpp -B llama.cpp/build-host -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_CCACHE=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_EXAMPLES=ON
          cmake --build llama.cpp/build-host --target llama-quantize llama-simple -j2

      - name: Quantize Syko to Q4_K_M
        run: |
          llama.cpp/build-host/bin/llama-quantize \
            out/models/SykoLLM-V1.2-Turkish-Instruct.F16.gguf \
            out/models/SykoLLM-V1.2-Turkish-Instruct.Q4_K_M.gguf \
            Q4_K_M
          rm out/models/SykoLLM-V1.2-Turkish-Instruct.F16.gguf
          test -s out/models/SykoLLM-V1.2-Turkish-Instruct.Q4_K_M.gguf
          ls -lh out/models/*.gguf | tee out/info/model-sizes.txt

      - name: Host sanity test Stentor
        run: |
          set -o pipefail
          llama.cpp/build-host/bin/llama-simple \
            -m out/models/Stentor-30M-Instruct.Q4_K_M.gguf \
            -c 128 -n 16 -t 1 \
            -p '[INST] What is the capital of France? Answer briefly.[/INST]' \
            2>&1 | tee out/info/stentor-host-test.txt

      - name: Host sanity test Syko
        run: |
          set -o pipefail
          llama.cpp/build-host/bin/llama-simple \
            -m out/models/SykoLLM-V1.2-Turkish-Instruct.Q4_K_M.gguf \
            -c 128 -n 16 -t 1 \
            -p '<user> Türkiye nin başkenti neresidir? Kısa cevap ver.<assistant>' \
            2>&1 | tee out/info/syko-host-test.txt

      - name: Write Miyoo device test scripts
        run: |
          cat > out/test-stentor.sh <<'EOF'
          #!/bin/sh
          DIR=$(cd -- "$(dirname "$0")" && pwd)
          LOG="$DIR/stentor-miyoo.log"
          echo '=== MiyooAI / Stentor 30M Q4_K_M ===' > "$LOG"
          date >> "$LOG" 2>&1 || true
          free -k >> "$LOG" 2>&1 || true
          "$DIR/bin/miyoo-infer" \
            -m "$DIR/models/Stentor-30M-Instruct.Q4_K_M.gguf" \
            -c 128 -n 32 -t 2 \
            -p '[INST] What is the capital of France? Answer briefly.[/INST]' \
            >> "$LOG" 2>&1
          RC=$?
          free -k >> "$LOG" 2>&1 || true
          echo "exit_code=$RC" >> "$LOG"
          cat "$LOG"
          exit $RC
          EOF

          cat > out/test-syko.sh <<'EOF'
          #!/bin/sh
          DIR=$(cd -- "$(dirname "$0")" && pwd)
          LOG="$DIR/syko-miyoo.log"
          echo '=== MiyooAI / Syko Turkish 51M Q4_K_M ===' > "$LOG"
          date >> "$LOG" 2>&1 || true
          free -k >> "$LOG" 2>&1 || true
          "$DIR/bin/miyoo-infer" \
            -m "$DIR/models/SykoLLM-V1.2-Turkish-Instruct.Q4_K_M.gguf" \
            -c 128 -n 32 -t 2 \
            -p '<user> Türkiye nin başkenti neresidir? Kısa cevap ver.<assistant>' \
            >> "$LOG" 2>&1
          RC=$?
          free -k >> "$LOG" 2>&1 || true
          echo "exit_code=$RC" >> "$LOG"
          cat "$LOG"
          exit $RC
          EOF

          cat > out/ask-stentor.sh <<'EOF'
          #!/bin/sh
          DIR=$(cd -- "$(dirname "$0")" && pwd)
          Q="$*"
          [ -n "$Q" ] || Q='Hello, introduce yourself briefly.'
          exec "$DIR/bin/miyoo-infer" \
            -m "$DIR/models/Stentor-30M-Instruct.Q4_K_M.gguf" \
            -c 128 -n 48 -t 2 -p "[INST] $Q[/INST]"
          EOF

          cat > out/ask-syko.sh <<'EOF'
          #!/bin/sh
          DIR=$(cd -- "$(dirname "$0")" && pwd)
          Q="$*"
          [ -n "$Q" ] || Q='Selam, kendini kısaca tanıtır mısın?'
          exec "$DIR/bin/miyoo-infer" \
            -m "$DIR/models/SykoLLM-V1.2-Turkish-Instruct.Q4_K_M.gguf" \
            -c 128 -n 48 -t 2 -p "<user> $Q<assistant>"
          EOF

          chmod +x out/*.sh out/bin/miyoo-infer
          cp llama-commit.txt out/info/llama-commit.txt

          cat > out/README.txt <<'EOF'
          MiyooAI native/offline proof-of-concept

          Target:
            Miyoo Mini Plus / OnionOS / Cortex-A7 / ARMv7-A / hard-float / 128 MB RAM

          Runtime:
            bin/miyoo-infer
            Native llama.cpp/ggml CPU inference, compiled with Miyoo Mini Buildroot toolchain.
            No server, GPU, HTTP or external AI service is used.

          Models:
            Stentor-30M-Instruct Q4_K_M              English/general
            SykoLLM-V1.2-Turkish-Instruct Q4_K_M    Turkish

          FIRST DEVICE TEST:
            1) Copy this entire folder to the SD card.
            2) From SSH/terminal run: ./test-stentor.sh
            3) Then run: ./test-syko.sh
            4) Send back stentor-miyoo.log and syko-miyoo.log.

          Initial limits are intentionally conservative:
            context = 128 tokens
            output  = 32 tokens for benchmark scripts
            threads = 2

          Logs include process VmRSS/VmHWM, load time, generation time and token/sec.
          Do not raise context until both models survive the first physical-device RAM test.
          EOF

          sha256sum out/bin/miyoo-infer out/models/*.gguf | tee out/info/SHA256SUMS.txt
          du -h out/bin/miyoo-infer out/models/*.gguf | tee out/info/final-sizes.txt

      - name: Upload MiyooAI native package
        uses: actions/upload-artifact@v4
        with:
          name: MiyooAI-native-Stentor30M-Syko51M
          path: out/
          compression-level: 6

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MiyooAI-release-failure-info
          path: |
            out/
            syko-hf/config.json
            llama-commit.txt
          if-no-files-found: ignore
          compression-level: 6
