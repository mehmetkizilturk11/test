name: build-miyooai-debug

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-miyooai-debug.yml'

jobs:
  arm-debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build wget file git xz-utils

      - name: Install Miyoo toolchain
        run: |
          wget -q -O /tmp/miyoomini-toolchain.tar.xz \
            https://github.com/shauninman/miyoomini-toolchain-buildroot/releases/download/v0.0.3/miyoomini-toolchain.tar.xz
          sudo tar -C /opt -xf /tmp/miyoomini-toolchain.tar.xz
          /opt/miyoomini-toolchain/usr/bin/arm-linux-gnueabihf-gcc --version
          /opt/miyoomini-toolchain/usr/bin/arm-linux-gnueabihf-g++ --version

      - name: Clone pinned llama.cpp
        run: |
          git init llama.cpp
          git -C llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C llama.cpp fetch --depth 1 origin b81c99b479d4c24e5eeca10de99032ebd343ef8f
          git -C llama.cpp checkout --detach FETCH_HEAD

      - name: Install tiny llama-linked executable and link fixes
        run: |
          cat > llama.cpp/examples/simple/simple.cpp <<'CPP'
          #include "llama.h"
          #include <cstdio>
          int main() {
              llama_model_params p = llama_model_default_params();
              std::printf("miyoo llama core linked; gpu_layers=%d\n", p.n_gpu_layers);
              return 0;
          }
          CPP
          cat > llama.cpp/examples/simple/CMakeLists.txt <<'CMAKE'
          set(TARGET llama-simple)
          add_executable(${TARGET} simple.cpp)
          install(TARGETS ${TARGET} RUNTIME)
          target_link_libraries(${TARGET} PRIVATE llama ${CMAKE_THREAD_LIBS_INIT} pthread stdc++fs)
          target_compile_features(${TARGET} PRIVATE cxx_std_17)
          CMAKE

      - name: Configure and build ARMv7 with full diagnostics
        id: arm_build
        shell: bash
        run: |
          set +e
          mkdir -p debug-out
          cat > miyoo-toolchain.cmake <<'EOF'
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR arm)
          set(CMAKE_TRY_COMPILE_TARGET_TYPE STATIC_LIBRARY)
          set(MIYOO_TC /opt/miyoomini-toolchain/usr/bin/arm-linux-gnueabihf-)
          set(CMAKE_C_COMPILER ${MIYOO_TC}gcc)
          set(CMAKE_CXX_COMPILER ${MIYOO_TC}g++)
          set(CMAKE_C_FLAGS_INIT "-march=armv7-a -mfpu=neon-vfpv4 -mfloat-abi=hard")
          set(CMAKE_CXX_FLAGS_INIT "-march=armv7-a -mfpu=neon-vfpv4 -mfloat-abi=hard")
          set(CMAKE_EXE_LINKER_FLAGS_INIT "-static-libgcc -static-libstdc++")
          set(GGML_NATIVE OFF CACHE BOOL "" FORCE)
          set(GGML_CPU_ALL_VARIANTS OFF CACHE BOOL "" FORCE)
          set(GGML_CPU_ARM_ARCH "armv7-a" CACHE STRING "" FORCE)
          EOF

          cmake -S llama.cpp -B llama.cpp/build-miyoo -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/miyoo-toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ALL_VARIANTS=OFF \
            -DGGML_CPU_ARM_ARCH=armv7-a \
            -DGGML_OPENMP=OFF \
            -DGGML_BLAS=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DGGML_CCACHE=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON \
            2>&1 | tee debug-out/configure.log
          CONFIG_RC=${PIPESTATUS[0]}

          cp llama.cpp/build-miyoo/CMakeCache.txt debug-out/CMakeCache.txt 2>/dev/null || true
          grep -nE -- 'GGML_NATIVE|GGML_CPU_ALL_VARIANTS|GGML_CPU_ARM_ARCH|-mcpu=|-march=|dotprod|i8mm|sve|sme|pthread|stdc\+\+fs' \
            llama.cpp/build-miyoo/build.ninja > debug-out/flags.txt 2>&1 || true

          if [ "$CONFIG_RC" -eq 0 ]; then
            cmake --build llama.cpp/build-miyoo --target llama-simple -v -j2 \
              2>&1 | tee debug-out/build.log
            BUILD_RC=${PIPESTATUS[0]}
          else
            BUILD_RC=99
          fi

          echo "configure_rc=$CONFIG_RC" | tee debug-out/result.txt
          echo "build_rc=$BUILD_RC" | tee -a debug-out/result.txt
          tail -n 250 debug-out/build.log > debug-out/build-tail.txt 2>/dev/null || true

          if [ -f llama.cpp/build-miyoo/bin/llama-simple ]; then
            cp llama.cpp/build-miyoo/bin/llama-simple debug-out/miyoo-infer-debug
            /opt/miyoomini-toolchain/usr/bin/arm-linux-gnueabihf-strip debug-out/miyoo-infer-debug || true
            file debug-out/miyoo-infer-debug > debug-out/file.txt
            /opt/miyoomini-toolchain/usr/bin/arm-linux-gnueabihf-readelf -A debug-out/miyoo-infer-debug > debug-out/attributes.txt || true
            /opt/miyoomini-toolchain/usr/bin/arm-linux-gnueabihf-readelf -d debug-out/miyoo-infer-debug > debug-out/dynamic.txt || true
            ls -lh debug-out/miyoo-infer-debug > debug-out/size.txt
          fi

          exit "$BUILD_RC"

      - name: Upload ARM diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MiyooAI-arm-debug
          path: debug-out/
          if-no-files-found: warn
          compression-level: 6
